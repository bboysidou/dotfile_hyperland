# Echo cancellation for the microphone.
# A WirePlumber smart filter: it sits in front of the default input and
# follows it when the input changes. The reference signal is the monitor of
# the default output, so anything played on the speakers is removed from the
# mic before calls hear it.
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name     = aec/libspa-aec-webrtc
            monitor.mode     = true
            node.description = "Echo Cancellation"
            capture.props = {
                node.name    = "capture.quickshell-aec"
                node.passive = true
            }
            source.props = {
                node.name         = "quickshell-aec"
                node.description  = "Echo-Cancelled Mic"
                media.class       = Audio/Source
                filter.smart      = true
                filter.smart.name = "quickshell-aec"
            }
            sink.props = {
                node.name    = "reference.quickshell-aec"
                node.passive = true
            }
        }
    }
]
