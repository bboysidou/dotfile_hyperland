# vim: ft=tmux
# devaslife's status-line style, with my own segments.
# BAR (#0d0d0d) sits just above the terminal's black so the bar reads as its own strip.
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

set -g status "on"
set -g status-interval 5
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=#0d0d0d"
set -g status-bg "#0d0d0d"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#000000,bg=#eee8d5,bold] 󰆍 #(echo \"#S\" | awk \"{print toupper(\\\$0)}\") #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#000000,bg=#93a1a1,bold] 󰉋 #{b:pane_current_path} #[fg=#93a1a1,bg=#0d0d0d,nobold]"
set -g status-right "#[fg=#657b83,bg=#0d0d0d,nobold,nounderscore,noitalics]#[fg=#000000,bg=#657b83] #(bash ~/.config/tmux/scripts/ram.sh) #[fg=#93a1a1,bg=#657b83]#[fg=#000000,bg=#93a1a1] 󱑎 %H:%M #[fg=#eee8d5,bg=#93a1a1]#[fg=#000000,bg=#eee8d5,bold] 󰃭 %Y-%m-%d "

setw -g window-status-activity-style "underscore,fg=#839496,bg=#0d0d0d"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=#0d0d0d"
setw -g window-status-format '#[fg=#586e75,bg=#0d0d0d,nobold] #I:#W '
setw -g window-status-current-format '#[fg=#0d0d0d,bg=#eee8d5]#[fg=#b58900,bg=#eee8d5,bold] #I #[fg=#eee8d5,bg=#b58900]#[fg=#000000,bg=#b58900,bold] #W #[fg=#b58900,bg=#0d0d0d,nobold]'
