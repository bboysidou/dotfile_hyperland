set -g default-terminal "screen-256color"

# Colors (auto-generated by apply_theme.sh)
source-file ~/.config/tmux/colors.conf

# Ctrl+number to select window
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F8 select-window -t 6
bind -n F9 select-window -t 7
bind -n F10 select-window -t 8
bind -n F11 select-window -t 9
bind -n F12 select-window -t 10

# CHANGE TMUX PREFIX
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# START WINDOWS AND PANES AT 1 NOT 0
set -g base-index 1
setw -g pane-base-index 1
set -g pane-border-line simple
set -g renumber-windows on

# ENABLE MOUSE
set -g mouse on
set-option -g status on

# CHANGE HISTORY LIMIT
set -g history-limit 100000

# NEW WINDOW IN CURRENT PATH
bind c new-window -c "#{pane_current_path}"

# HORIZONTAL AND VERTICAL SPLIT
unbind %
bind e split-window -h -c "#{pane_current_path}"

unbind '"'
bind v split-window -v -c "#{pane_current_path}"

unbind r
bind r run-shell '~/.config/custom_scripts/tmux_reload_config.sh'

# RESIZING PANES
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# MAXIMIZE PANE
bind -r m resize-pane -Z 

# ENABLE VI MODE IN TMUX
set-window-option -g mode-keys vi
set-option -g set-clipboard on
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe "wl-copy"
bind-key -r C-s run-shell '~/.config/custom_scripts/tmux_save_sessions.sh'
bind-key -r C-c run-shell 'tmux neww ~/.config/custom_scripts/ssh_connection.sh'
bind-key -r a run-shell 'tmux neww ~/.config/custom_scripts/tmux_resurect_session.sh'
bind-key -r y run-shell 'tmux new-window -c "#{pane_current_path}" yazi'
bind-key -r p run-shell 'tmux popup -w 80% -h 80%'

unbind -T copy-mode-vi MouseDragEnd1Pane

# TMUX PLUGIN MANAGER
set -g @plugin 'tmux-plugins/tpm'

# LIST OF PLUGINS
set -g @plugin 'christoomey/vim-tmux-navigator'
#
# THEME / STATUS LINE (from devaslife, taken as-is)
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf

# INITIALIZE TMUX PLUGIN MANAGER (KEEP THIS LINE AT THE VERY BOTTOM OF TMUX.CONF)
run '~/.tmux/plugins/tpm/tpm'
